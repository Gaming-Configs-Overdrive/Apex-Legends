# Game manifest, see docs/GAME_MANIFEST.md and schema/game.schema.json.
# yaml-language-server: $schema=./schema/game.schema.json
# variants = <profile>-<resolution>, generated by `npm run variants`.
schema: 1
id: apex-legends
name: Apex Legends
online: true
stores:
  steam:
    appid: 1172470
detect:
  exe: r5apex.exe
processes: [r5apex.exe, r5apex_dx12.exe]
variants:
  - competitive-1080p
  - competitive-1440p
  - competitive-4k
  - competitive-720p
  - quality-1080p
  - quality-1440p
  - quality-4k
  - quality-720p
  - ultraquality-1080p
  - ultraquality-1440p
  - ultraquality-4k
  - ultraquality-720p
files:
  - src: configs/variants/{variant}/autoexec.cfg
    target: '{GAME_DIR}/cfg/autoexec.cfg'
    format: kv
    strategy: replace
    onlineRisk: tos
  - src: configs/variants/{variant}/videoconfig.txt
    target: '{SAVED_GAMES}/Respawn/Apex/local/videoconfig.txt'
    format: kv
    strategy: merge
    readOnly: true
    onlineRisk: tos
notes:
  launchOptions: '+exec autoexec'
  general: >-
    EA app / Epic: pass --game-dir. Unauthorized file changes violate EA's
    terms; no bans for autoexec.cfg or videoconfig.txt are known.
