name: Build and Release

on:
  push:
    branches: [ main ]

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check CHANGELOG.md changed
        id: changelog-check
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          if git diff --name-only $PREV_TAG HEAD | grep -q "^CHANGELOG.md$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: Build with Rollup
        run: yarn build

      - name: Upload build artifacts
        if: steps.changelog-check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Extract new version from CHANGELOG
        id: version
        run: |
          VERSION=$(grep -Eo "## \[[0-9]+\.[0-9]+\.[0-9]+\]" CHANGELOG.md | grep -Eo "[0-9]+\.[0-9]+\.[0-9]+" | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found
          ' CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        if: steps.changelog-check.outputs.changed == 'true'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.changelog-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release create "v$VERSION" dist/releases/*.zip --title "v$VERSION" --notes "$NOTES"
